# Validation only: this game must not be trained yet.
paths:
  dolphin: D:\emuladores\Dolphin-x64\Dolphin.exe
  source_user: '%APPDATA%\Dolphin Emulator'
  user: .local/smg1-user
  rom: data/Super Mario Galaxy (USA) (En,Fr,Es).nkit.iso
  assets: data
  runs: runs/smg1
  calibration: config/smg1-calibration.json
environment:
  action_seconds: 0.25
  key_hold_seconds: 0.08
  reset_timeout: 30.0
  max_steps: 3000
  idle_limit: 400
  image_size: 84
  frame_stack: 4
  crop:
  - 0.12
  - 0.17
  - 0.88
  - 0.91
  min_reward_y: -1800.0
  max_step_distance: 2500.0
rewards:
  completion: 20.0
  death: -2.0
  progress: 5.0
  intrinsic: 0.02
  step: -0.0001
novelty:
  neighbors: 10
  capacity: 4000
  embedding_size: 64
  rnd_clip: 5.0
training:
  seed: 42
  steps: 1000000
  rollout_steps: 128
  batch_size: 256
  epochs: 4
  learning_rate: 0.0001
  gamma: 0.997
  gae_lambda: 0.95
  entropy: 0.01
  checkpoint_steps: 4096
  device: cuda
  torch_threads: 2
  enabled: false
parallel:
  workers: 1
  emulation_speed: 2.0
  frame_skip: 12
  timeout: 30.0
  hidden: true
  plot_every: 20
variations:
- name: sweet_sweet
  title: Rocky Road
  scenario: 1
  start_slot: 1
  goal_slot: 2
game:
  id: RMGE01
  title: Super Mario Galaxy
