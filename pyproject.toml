[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-rl"
version = "0.1.0"
description = "Visual recurrent reinforcement learning for Super Mario Galaxy 1 and 2 in Dolphin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "PedroM2626"}]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "opencv-python>=4.10,<5", "gymnasium>=1.0,<2",
  "stable-baselines3>=2.5,<3", "sb3-contrib>=2.5,<3", "torch>=2.3,<3",
  "matplotlib>=3.8,<4", "mss>=10,<11", "pywin32>=306; sys_platform == 'win32'",
  "dolphin-memory-engine>=1.3,<2", "PyYAML>=6,<7", "psutil>=5.9,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
smg-rl = "smg_rl.cli:main"

[project.urls]
Repository = "https://github.com/PedroM2626/smg-rl"
Documentation = "https://github.com/PedroM2626/smg-rl/blob/main/docs/README.md"
Issues = "https://github.com/PedroM2626/smg-rl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
